[project]
name = "neura-ai"
version = "2.0.0"
description = "Neura AI — Next-Gen Voice & Holographic AI Assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp",
    "httpx",
    "livekit-agents[deepgram,groq,openai,sarvam,silero]>=1.5.1",
    "livekit-plugins-google>=1.5.1",
    "python-dotenv",
    "psutil",
    "beautifulsoup4",
]

[project.scripts]
neura = "server:main"
neura_voice = "agent_edith:dev"
neura_hologram = "floating_ultron:main"
neura_floating = "floating_ultron:main"
edith = "server:main"
edith_voice = "agent_edith:dev"
ultron_siri = "floating_ultron:main"
ultron_floating = "floating_ultron:main"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server.py"]
