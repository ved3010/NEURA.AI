[project]
name = "edith-tactical-ai"
version = "2.0.0"
description = "E.D.I.T.H. — Even In Death, I'm The Hero — Next-Gen Tactical AI Core"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp",
    "httpx",
    "livekit-agents[deepgram,groq,openai,sarvam,silero]>=1.5.1",
    "livekit-plugins-google>=1.5.1",
    "python-dotenv",
    "psutil",
    "beautifulsoup4",
]

[project.scripts]
edith = "server:main"
edith_voice = "agent_edith:dev"
friday = "server:main"
friday_voice = "agent_friday:dev"
ultron_siri = "floating_ultron:main"
ultron_floating = "floating_ultron:main"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server.py"]
